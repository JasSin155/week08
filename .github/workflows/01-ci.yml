name: 01 - CI

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =========================================================
  # NEW for Task 10.2D — Infrastructure as Code
  #
  # Runs terraform init/validate/plan/apply automatically on every push to
  # main, against the remote state backend declared in terraform/versions.tf.
  # This is the actual "Terraform integrated into GitHub Actions" requirement,
  # not just Terraform code sitting in the repo, the pipeline itself now owns
  # provisioning and keeping the infrastructure in the state this file
  # declares, the same way `terraform apply` used to be a command a human
  # typed by hand at the end of Weeks 6-9.
  # =========================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    outputs:
      acr_login_server: ${{ steps.tf_outputs.outputs.acr_login_server }}
      aks_cluster_name: ${{ steps.tf_outputs.outputs.aks_cluster_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # azure/login already put a service-principal token in the runner's
      # environment as ARM_* is NOT automatically exported for Terraform, so
      # it is set explicitly here from the same AZURE_CREDENTIALS secret
      # azure/login itself already consumes. This is what both the azurerm
      # provider AND the azurerm remote-state backend (use_azuread_auth =
      # true in versions.tf) authenticate with, no separate storage account
      # key needed.
      - name: Export ARM_* credentials for Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="resource_group_name=${{ vars.AKS_RESOURCE_GROUP }}" \
            -var="acr_name=${{ vars.ACR_NAME }}" \
            -var="storage_account_name=${{ vars.STORAGE_ACCOUNT_NAME }}" \
            -var="aks_cluster_name=${{ vars.AKS_CLUSTER_NAME }}" \
            -var="aks_dns_prefix=${{ vars.AKS_DNS_PREFIX }}" \
            -out=tfplan

      # Full automatic apply, no manual approval gate, per the design decision
      # recorded in the Task 10.2D explanation doc: every push to main is
      # trusted to reconcile real infrastructure. See the risk note in the
      # runbook about what this means on a shared CloudLabs subscription.
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)" >> "$GITHUB_OUTPUT"


  # =========================================================
  # NEW for Task 10.2D — Monitoring and Observability
  #
  # Placed after terraform-apply (needs the AKS cluster to exist) and
  # independent of backend-test / build-and-push, since monitoring the
  # cluster does not depend on the application images having been built.
  # Uses `helm upgrade --install`, not `helm install`, specifically so this
  # step is safe to run on every single push, not just the first one, a
  # plain `helm install` would fail on the second CI run with "cannot
  # re-use a name that is still in use".
  # =========================================================
  monitoring:
    name: Deploy / Validate Monitoring
    runs-on: ubuntu-latest
    needs: [terraform-apply]

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ needs.terraform-apply.outputs.aks_cluster_name }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add prometheus-community Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy kube-prometheus-stack (Prometheus + Grafana)
        run: |
          helm upgrade --install kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Validate monitoring pods are running
        run: |
          kubectl get pods -n monitoring
          kubectl wait --for=condition=Ready pods --all \
            -n monitoring --timeout=300s


  # =========================================================
  # Backend Tests (unchanged from Week 08)
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Scan, and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # NEW for Task 10.2D: also needs terraform-apply, the ACR this job pushes
    # to is now provisioned by the pipeline itself in the same run, not
    # something that already existed from a manual apply weeks ago.
    needs:
      - backend-test
      - terraform-apply

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ needs.terraform-apply.outputs.acr_login_server }}/${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # =========================================================
      # NEW for Task 10.2D — Security Scanning
      #
      # Scans the image locally, before it is pushed, so a vulnerable image
      # never reaches the registry that staging/production later pull from.
      # =========================================================
      - name: Log in to Docker Hub (required for Docker Scout CI auth)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image with Docker Scout
        id: docker-scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ needs.terraform-apply.outputs.acr_login_server }}/${{ matrix.image }}:${{ github.sha }}
          only-severities: critical,high
          only-fixed: "true"
          exit-code: "1"

      - name: Push Docker image with commit SHA
        if: success()
        run: |
          docker push \
            ${{ needs.terraform-apply.outputs.acr_login_server }}/${{ matrix.image }}:${{ github.sha }}

      # --- Documented fallback -------------------------------------------
      # Same fallback as Task 10.3HD's CI gate: if Docker Scout's Docker Hub
      # dependency proves unreliable in CI, replace the two steps above with
      # Trivy, which needs no external account:
      #
      #   - name: Scan image with Trivy
      #     uses: aquasecurity/trivy-action@0.24.0
      #     with:
      #       image-ref: ${{ needs.terraform-apply.outputs.acr_login_server }}/${{ matrix.image }}:${{ github.sha }}
      #       severity: CRITICAL,HIGH
      #       exit-code: "1"
